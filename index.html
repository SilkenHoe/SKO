/* === CSS d’origine de la page « fiches » (repris tel quel) === */
@font-face{font-family: 'Qalisso'; src: url('https://dl.dropboxusercontent.com/scl/fi/87x36vff7s5mow6yle49q/Qalisso.otf?rlkey=az9lijxdy0tsykihi70e2yfwh&st=qm7wcaha&dl=0') ; format("opentype");}
.container{display: block; width: 800px; margin: auto;}
:root{--sans: 'Poppins', arial; --sans2: 'Poppins', sans-serif; --serif: 'Poppins', sans-serif; --titlefont: 'Qalisso'; --fonta: "Font Awesome 6 Pro"; --fonta2: "Font Awesome 7 Pro"; --jp: 'JoyPixels';}

a{color: inherit;}

html, :root{--body-bg-img: url(https://cdn.discordapp.com/attachments/750393727364628491/780188266842423306/bigbg3.png); --body-bg-color: #d9dadb; --text: #222; --text2: #010101; --wrapper-bg: #f1f2f3; --drop-shadow: 0,0,0,; --topbar-bg: #fff; --grad-under: #fff; --border-color: #e3e4e7; --blend-mode: screen; --shade0: #ffffff; --shade1: #f8f8f8; --shade2: #eeeeee; --shade3: #eaeaea; --shade4: #ccc; --shade5: #a0a4a9; --shade6: #9fa5ae; --shade7: #767e8b; --shade8: #50545b; --shade8: #b6babe; --shade9: #060607; --opposite: #181818; --opptext: #fff; --filterfiche:brightness(0.5) grayscale(1) contrast(1.5); --filterfichehover: brightness(0.6) grayscale(0) contrast(1); scroll-behavior: smooth;}

a{text-decoration:none;}
.drm-business{display: block; width: 800px; margin: 20px auto; background: var(--shade0); border: 1px solid var(--shade4); border-radius: 6px; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%); overflow: hidden;}
.drm-business top{position: relative; display: block; padding: 70px 0; background: linear-gradient(to right, rgba(var(--clr1).3), rgba(var(--clr2).3), rgba(var(--clr3).3)); text-align: center;}

.drm-business inner rev{position: relative; display: block; margin: 0px 40px 40px;}

.drm-business inner rev q{quotes: none; position: relative; display: block; padding: 75px 100px; border-radius: 6px; text-align: justify; font: 300 22px/200% var(--sans); letter-spacing: -.25px; word-spacing: 3px; background: var(--shade0) linear-gradient(to bottom right, rgba(var(--clr1).3), rgba(var(--clr2).3), rgba(var(--clr3).3)); color: var(--shade9); overflow: hidden; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%);}
.drm-business inner rev w{position: relative;}

.drm-business inner rev stars b{font-family: var(--fonta); font-weight: 600; color: rgba(var(--clr2)1); letter-spacing: 4px; text-align: right;}

.drm-business inner rev stars.three b:before{content: '\24 \24 \24';}
.drm-business inner rev stars.four b:before{content: '\24 \24 \24 \24';}
.drm-business inner rev stars.five b:before{content: '\24 \24 \24 \24 \24';}
.drm-business inner abt{display: block; border-top: 1px solid var(--shade4); background: var(--shade0) linear-gradient(145deg, rgba(var(--clr3).3), rgba(var(--clr2).3), rgba(var(--clr1).3)); padding: 40px; max-height: 850px; overflow: auto;}
.drm-business inner abt words, .drm-business inner abt block{display: block; background: var(--shade0); padding: 30px 35px; border-radius: 6px; font: 400 14px/220% var(--sans); text-align: justify; letter-spacing: .25px; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%);}
.drm-business inner abt > block{max-width: 445px;}
.drm-business inner abt b{font-weight: 600; color: rgba(var(--clr1)1);}
.drm-business inner abt i{font-size: 105%; color: rgba(var(--clr2)1);}
.drm-business inner abt u{text-decoration: none; background: transparent linear-gradient(45deg, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)) no-repeat bottom left/100% 3px; font-weight: 600; letter-spacing: 0px; padding-bottom: 2px;}
abt > div > blockquote block{max-width: none !important;}
.drm-business inner h2{display: flex; align-items: center; justify-content: space-between; margin: 20px 0; padding: 30px 35px; background: linear-gradient(45deg, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); font: 600 0.8em var(--sans); text-transform: uppercase; letter-spacing: 3px; color: var(--shade0); border-radius: 6px; box-shadow: 0px 2px 4px -2px rgb(0 0 0 / 20%);}

.drm-business inner abt h2{color: var(--shade9);}

.drm-business inner h3 f{display: table; font-size: 2em; background: linear-gradient(to bottom right, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; -webkit-box-decoration-break: clone;}
.drm-business inner abt blockquote{display: block; margin: 1em 0px; border-left: 1px solid rgba(var(--clr2)1); padding-left: 1.5em;}
.drm-business inner abt blockquote block2{display: flex; align-items: center; justify-content: space-between; background: var(--shade0) linear-gradient(145deg, rgba(var(--clr1).7), rgba(var(--clr2).7), rgba(var(--clr3).7)); color: var(--text); margin: 15px 0px; padding: 30px 35px; border-radius: 6px; box-shadow: 0px 2px 4px -2px rgb(0 0 0 / 20%); font: 400 14px/160% var(--sans); letter-spacing: .25px; color: var(--shade9); text-align: right;}
.drm-business inner abt blockquote block2 f{display: table; font-size: 26px; color: var(--opptext);}
.drm-business exp{display: flex; flex-flow: row wrap; align-items: stretch; justify-content: stretch; background: var(--shade1); border-top: 1px solid var(--shade4); padding: 40px; gap: 15px 15px;}
.drm-business exp h2, .drm-business exp h3{flex-grow: 2; width: 100%; display: flex; align-items: center; justify-content: space-between; margin: 0px;}
.drm-business exp h3{background: var(--shade2); color: var(--shade9);}
.drm-business exp a, .drm-business exp span{flex: 1 1 160px; flex-grow: 1;}
.drm-business exp span{position: relative; text-align: center; border-radius: 6px; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%); transition: -webkit-transform .5s;}
.drm-business exp span w{position: relative; display: flex; flex-flow: column nowrap; align-items: center; justify-content: center; text-align: center; background: var(--shade0) linear-gradient(to bottom, transparent, rgba(var(--clr1).25)); padding: 50px; z-index: 9; border-radius: 4px 4px 0px 0px;}
.drm-business exp span b{display: table; font: 300 26px/32px var(--sans); text-transform: lowercase; letter-spacing: -1px; background: linear-gradient(to bottom right, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; -webkit-box-decoration-break: clone;}
.drm-business exp span i{display: table; margin: 20px auto 0px; font: 500 9px var(--sans); text-transform: uppercase; letter-spacing: 1px; background: var(--shade0) linear-gradient(to left, rgba(var(--clr1)1), rgba(var(--clr1)1)); color: white; padding: 8px 15px; border-radius: 4px; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%);}
.drm-business exp span d{display: block; font: 500 10px var(--sans); letter-spacing: 1px; word-spacing: 2px; text-transform: uppercase; background: var(--shade0); color: var(--shade9); padding: 18px 20px; border-top: 1px solid rgba(var(--clr1).4); border-radius: 0px 0px 4px 4px;}
.drm-business exp span:hover{-webkit-transform: scale(1.015); cursor: crosshair;}
.drm-business act{display: block; padding: 40px; border-top: 1px solid var(--shade4); background: var(--shade0) linear-gradient(to top right, rgba(var(--clr1).2), rgba(var(--clr2).2), rgba(var(--clr3).2));}
.drm-business act h2, .drm-business act h3{margin-top: 0px;}
.drm-business act h2 f{color: var(--shade9);}
.drm-business act span{position: relative; display: block; background: var(--shade0) linear-gradient(125deg, rgba(var(--clr1).1) 0px, rgba(var(--clr2).05) 70%, rgba(var(--clr3).05) 100%); margin-bottom: 15px; border-radius: 6px; text-align: justify; padding: 50px; padding-left: calc(10px + 50px); box-shadow: 0px 2px 4px -2px rgb(0 0 0 / 20%); transition: -webkit-transform .5s;}
.drm-business act span:last-of-type{margin-bottom: 0px;}
.drm-business act span:after{content: ''; left: 0; bottom: 0; top: 0; position: absolute; display: block; width: 10px; background: var(--shade9) linear-gradient(to top, rgba(var(--clr1).9), rgba(var(--clr2).9), rgba(var(--clr3).9)); border-radius: 4px 0px 0px 4px;}
.drm-business act span b{font: 300 22px/160% var(--sans); letter-spacing: -.35px; word-spacing: 4px; padding-bottom: 2px; background: linear-gradient(to right, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); background-position: 0% 100%; background-repeat: no-repeat; background-size: 0% 3px; transition: background-size 1s;}
.drm-business act span:hover{-webkit-transform: scale(1.015); cursor: crosshair;}
.drm-business act span:hover b{background-size: 100% 3px;}
.drm-business act span b img{width: 22px; vertical-align: middle;}
.drm-business ctc{display: flex; flex-flow: row wrap; align-items: center; justify-content: space-between; padding: 40px; background: var(--shade0); border-top: 1px solid var(--shade4); gap: 15px;}
.drm-business ctc h3{flex-grow: 3; width: 100%; margin: 0px;}
.dark_mode .drm-business ctc h3{background: var(--shade1); color: var(--shade9);}
.drm-business ctc span{display: flex; flex-flow: row nowrap; align-items: center; justify-content: space-between; flex: 1 0 auto; background: var(--shade9) linear-gradient(145deg, rgba(var(--clr1).8), rgba(var(--clr2).8), rgba(var(--clr3).8)); padding: 20px 25px; border-radius: 6px; box-shadow: 0px 2px 3px -2px rgb(0 0 0 / 25%); font: 600 10px var(--sans); text-transform: uppercase; letter-spacing: 1.5px; color: white;}
.drm-business ctc span f{margin-left: -5px; font-size: 16px; background: ; -webkit-background-clip: text; -webkit-text-fill-color: inherit; color: white; -webkit-box-decoration-break: clone; opacity: .6;}
.drm-business ctc span:hover{background: var(--shade0) linear-gradient(145deg, rgba(var(--clr1).25), rgba(var(--clr2).25), rgba(var(--clr3).25)); color: var(--shade9); cursor: crosshair;}
.drm-business ctc span:hover f{background: linear-gradient(145deg, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; -webkit-box-decoration-break: clone; opacity: 1;}
.drm-business inner serv{display: block; padding: 40px; border-top: 1px solid var(--shade4); background: var(--shade1);}

.drm-business inner serv span:hover{background: var(--shade0) linear-gradient(-200deg, rgba(var(--clr1).1), rgba(var(--clr2).1), rgba(var(--clr3).1)); -webkit-transform: scale(1.0155);}
.drm-business inner serv span:last-of-type{margin-bottom: 0px;}
.drm-business inner serv span f{font-size: 18px; vertical-align: middle; margin-right: 25px; background: linear-gradient(to bottom right, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; -webkit-box-decoration-break: clone; width: 26px; text-align: center;}

.drm-business inner serv blockquote span{position: relative; padding-left: 40px;}
.drm-business inner serv blockquote span:after{content: ''; left: 0; bottom: 0; top: 0; position: absolute; display: block; width: 8px; background: var(--shade9) linear-gradient(to top, rgba(var(--clr1).9), rgba(var(--clr2).9), rgba(var(--clr3).9)); border-radius: 4px 0px 0px 4px;}
.drm-business inner cast{display: flex; flex-flow: row nowrap; align-items: stretch; justify-content: space-between; flex-direction: row-reverse; border-top: 1px solid var(--shade4); background: var(--shade0); height: 400px;}
.drm-business inner cast h{position: relative; display: flex; flex-flow: column nowrap; align-items: center; justify-content: space-between; min-width: 100px; background: var(--shade0) linear-gradient(to bottom, rgba(var(--clr1).1), rgba(var(--clr2).1), rgba(var(--clr3).1)); padding: 25px 0px 40px;}
.drm-business inner cast h:after{content: ''; position: absolute; top: 0; bottom: 0; left: 0; display: block; width: 5px; background: linear-gradient(to bottom, rgba(var(--clr1)1), rgba(var(--clr2)1), rgba(var(--clr3)1));}
.drm-business inner cast h x{display: block; font-size: 28px; margin: 10px auto; text-align: center; background: linear-gradient(to bottom right, rgba(var(--clr1).8), rgba(var(--clr2).8), rgba(var(--clr3).8)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: transparent; -webkit-box-decoration-break: clone;}
.drm-business inner cast h w{display: table; flex: 1 0 auto; font: 300 24px var(--sans); text-transform: lowercase; letter-spacing: -.25px; writing-mode: vertical-rl; transform: rotate(360deg); text-align: right;}

.drm-business inner cast sc blockquote block{display: block; background: var(--shade0) linear-gradient(to bottom right, rgba(var(--clr1).3), rgba(var(--clr2).3), rgba(var(--clr3).3)); color: var(--text); margin: 18px 0; padding: 30px 35px; border-radius: 6px; box-shadow: 0px 2px 4px -2px rgb(0 0 0 / 20%); font: 400 15px/160% var(--sans); letter-spacing: -0.25px; word-spacing: 2px; text-align: justify;}
.drm-business inner cast sc ch{display: flex; flex-flow: row nowrap; align-items: center; justify-content: space-between; padding: 25px 30px; border-radius: 6px; margin-bottom: 8px; background: var(--shade0) linear-gradient(45deg, rgba(var(--clr1).15), rgba(var(--clr2).15), rgba(var(--clr3).15)); font: 400 10px var(--sans); text-transform: uppercase; letter-spacing: 1.5px; text-align: right; color: var(--text); box-shadow: 0px 2px 4px -2px rgb(0 0 0 / 20%);}
.drm-business inner cast sc ch:last-of-type{margin-bottom: 0px;}

.drm-business inner cast sc ch strong{display: inline-block; margin: 2px 0px;}
.drm-business inner gall{display: block; padding: 40px; border-top: 1px solid var(--shade4); background: var(--shade2);}

.drm-business inner gall h2, .drm-business inner gall h3{margin: 0px;}
.drm-business inner grid{display: grid; grid-gap: 15px; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); grid-auto-rows: 150px; grid-auto-flow: dense; height: auto;}

/* === interface du lecteur (thème sombre uniquement) === */
:root{--bg:#111;--sb:#222;--s0:#1a1a1a;--s1:#0000002b;--s2:#2c2c2c;--line:#0000002b;--ink:#ddd;--mut:#9a9aa6;--c1:#6d5bd0;--c2:#8a5bd0;--c3:#5b6dd0;--acc:var(--c1);--fs:19px;--sh:0 10px 34px rgba(0,0,0,.55);
--t1:color-mix(in srgb,var(--c1) 62%,#fff);--t2:color-mix(in srgb,var(--c2) 62%,#fff);--t3:color-mix(in srgb,var(--c3) 62%,#fff);color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{scrollbar-width:thin}
/* ton CSS d’origine suppose content-box : border-box seulement pour l’interface du lecteur */
#fl,#fl *,#setm,#setm *,#menuBtn,nav,nav *,#modal,#modal *,.btn,.tab,.arcsep,.arcsep *,.lect,.lect *,#ctx,#ctx *,#lb,#lb *,#toast,.cg,.cg *,.empty,.empty *{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);overflow:hidden}
button{font:inherit}
.btn{color:inherit;background:var(--s1);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;transition:border-color .15s;    backdrop-filter: blur(20px);}
.btn:hover{border-color:var(--c1)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.pri{background:linear-gradient(145deg,var(--c1),var(--c2),var(--c3));color:var(--accfg,#fff);border-color:transparent}
.glass{background:var(--s1);border:1px solid var(--line);box-shadow:var(--sh)}
#app{height:100%}
#menuBtn{display:none}
.wrap{height:100%;display:flex;min-height:0}
nav{width:280px;flex:none;overflow:auto;background:var(--sb);border-right:1px solid var(--line);padding:10px 8px 40px}
.sc{margin-bottom:3px}
.sc>.t{width:100%;text-align:left;border:0;background:none;color:inherit;font-weight:600;padding:8px 10px;display:flex;align-items:center;gap:10px;border-radius:6px;cursor:pointer; text-transform: lowercase;}
.sc>.t .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni{width:26px;height:26px;border-radius:6px;flex:none;background: center / cover;
    mix-blend-mode: overlay;
    opacity: 0.6;
    filter: drop-shadow(0px 0px 1px black);}
.sc>.t:hover{background:var(--s2)}
.sc>.t:hover .ni,.sc.on .ni{filter:none}
.sc.on>.t{background:linear-gradient(145deg,var(--r1),var(--r2),var(--r3));color:var(--rf)}
.sc.on>.t .n,.sc.on>.t .chev{color:inherit;opacity:.8}
.sc.dt>.t{box-shadow:0 -2px 0 var(--c1)}.sc.db>.t{box-shadow:0 2px 0 var(--c1)}
.n{color:var(--mut);font-weight:400;font-size:12px}
.chev{color:var(--mut);font-size:11px;width:14px;text-align:center;cursor:pointer;font-style:normal}
.sub{padding:2px 0 8px 14px}
.arc{display:flex;align-items:center;gap:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:8px 0 2px}
.arc span:last-child{cursor:pointer;padding:2px 4px}
.sub a{display:block;padding:6px 12px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.sub a:hover{background:var(--s2)}
.sub a.cur{background:var(--s2);color:var(--t1);font-weight:600}
main{flex:1;overflow:auto;scroll-behavior:smooth;background:#111}
/* bandeau : outils, onglets */
.drm-business{position:relative}
.bt{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:5}
mt{display:block;margin-top:4px;font-size:12px;color:var(--shade7)}
tb{display:flex;justify-content:center;gap:8px;margin-top:16px}
.tab{border:1px solid var(--shade4);background:var(--shade1);color:var(--text);border-radius:6px;padding:6px 20px;cursor:pointer;font:600 11px var(--sans);letter-spacing:2px;text-transform:uppercase}
.tab.on{background:linear-gradient(145deg,rgba(var(--clr1),.8),rgba(var(--clr2),.8),rgba(var(--clr3),.8));color:#fff;border-color:transparent}
.hint{padding:40px}
/* lecture */
.lect{border-top:1px solid var(--shade4)}
.arcsep{display:flex;align-items:center;gap:6px;padding:14px 35px;background:var(--shade0) linear-gradient(145deg, rgba(var(--clr1).3), rgba(var(--clr2).3), rgba(var(--clr3).3));border-bottom:1px solid var(--shade4)}

const RV={I:1,V:5,X:10,L:50,C:100};

const n2rom=n=>{let o='';for(const[k,v]of[['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]])while(n>=v){o+=k;n-=v}return o||'—'};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* texte entre guillemets (" ", “ ”, « », „ “) → gras coloré */
const QB=/("[^"\n]+?"|“[^“”\n]+?”|«[^«»\n]+?»|„[^„“”\n]+?[“”])/g;
const qb=h=>h.replace(QB,'<b class="q">$1</b>');
const inlq=t=>qb(inl(t));
const inl=t=>esc(t)
 .replace(/&lt;(\/?)(b|i|u|em|strong)&gt;/gi,'<$1$2>')
 .replace(/\+\+(.+?)\+\+/g,'<u>$1</u>')
 .replace(/`([^`]+)`/g,'<code>$1</code>')
 .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
 .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
 .replace(/(^|[^*])\*(?![\s*])([^*]+?)(?<![\s*])\*(?!\*)/g,'$1<em>$2</em>')
 .replace(/(^|[^\w])_(?![\s_])([^_]+?)(?<![\s_])_(?![\w])/g,'$1<em>$2</em>')
 .replace(/~~(.+?)~~/g,'<del>$1</del>');
function md(src){
 return src.replace(/\r/g,'').split(/\n{2,}/).map(b=>{
  b=b.trim();if(!b)return'';
  if(/^([-*_])(\s*\1){2,}$/.test(b))return'<hr>';
  let m=b.match(/^(#{1,6})\s+(.*)$/s);
  if(m){const l=Math.min(5,m[1].length+2);return`<h${l}>${inlq(m[2])}</h${l}>`}
  const ls=b.split('\n');
  if(ls.every(l=>/^>/.test(l)))return'<blockquote>'+md(ls.map(l=>l.replace(/^>\s?/,'')).join('\n'))+'</blockquote>';
  if(ls.every(l=>/^\s*[-*+]\s+/.test(l)))return'<ul>'+ls.map(l=>'<li>'+inlq(l.replace(/^\s*[-*+]\s+/,''))+'</li>').join('')+'</ul>';
  if(ls.every(l=>/^\s*\d+[.)]\s+/.test(l)))return'<ol>'+ls.map(l=>'<li>'+inlq(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>';
  return'<p>'+inlq(b.replace(/\n/g,'  \n')).replace(/  \n/g,'<br>')+'</p>';
 }).join('\n');
}

const META=[

 /^\(?\s*(approx\.?|approximately|about|~|≈)?\s*\d[\d.,\s]*\s*(words?|mots)\b/i,
 /^(act|chapter|part|acte|chapitre)\s+([ivxlc]+|\d+)\b.*\b\d[\d.,]*\s*(words?|mots)\b/i,
 /^(act|chapter|part|acte|chapitre)\s+([ivxlc]+|\d+)\s*(is\s+)?(complete|completed|ends?|finished|done)\b/i,

 /^to\s+be\s+continued\b/i,
 /^(author['’]?s?\s+)?(note|a\/n|n\.b\.|ps)\s*[:.\-—]/i,
 /^(shall|should)\s+i\s+(proceed|continue|begin|start|write|move|go|carry)\b/i,
 /^(would\s+you\s+like|do\s+you\s+want|want)\s+me\s+to\b/i,
 /^ready\s+(for|to)\s+(act|chapter|continue|proceed|move|begin|the\s+next)\b/i,
 /^let\s+me\s+know\b/i,
 /^(just\s+)?(say|tell\s+me)\s+(the\s+word|when|if|how|go)\b/i,
 /^(i['’]ll|i\s+will)\s+(continue|proceed|wait|await)\b/i,
 /^(awaiting|waiting\s+for)\s+(your|the)\b/i,
 /^continu(e|ing)\s+(to|with|in|onto)\s+(act|chapter|part|the\s+next|next)\b/i,
 /^(proceed|proceeding|moving)\s+(to|on\s+to|with)\s+(act|chapter|the\s+next)\b/i,
 /^(next|coming\s+up)\s*[:\-—]?\s*(act|chapter)\b/i,
 /^(now,?\s+)?(let\s+me|i['’]ll|i\s+will)\s+(begin|start|write|continue)\s+(writing\s+)?(act|chapter|part)\b/i

const isMeta=l=>{const t=l.replace(/^[\s>*_#\[\(~`\-—–]+/,'').replace(/[\s*_\]\)`]+$/,'');return !!t&&META.some(r=>r.test(t))};
function cleanTail(md){
 const L=String(md||'').replace(/\r/g,'').split('\n');let e=L.length,hit=false;
 const skip=l=>!l.trim()||/^\s*([-*_]\s*){3,}$/.test(l);
 for(;;){
  let j=e-1;while(j>=0&&skip(L[j]))j--;

  e=j;hit=true;
 }
 if(!hit)return md;
 let j=e-1;while(j>=0&&skip(L[j]))j--;
 return L.slice(0,j+1).join('\n').trim();
}
const HW='Act|Acte|Chapter|Chapitre|Part|Partie|Scene|Scène';
const HRX=new RegExp('^(?:'+HW+')\\s+([IVXLC]+|\\d+)\\b[\\s*_:—–.)\\-]*(.*)$','i');
function headOf(l,strict){
 if(l.length>200)return null;
 if(strict&&!/^\s*(?:>\s*)?[*_#]/.test(l))return null;
 const m=l.replace(/^[\s*_#>]+/,'').match(HRX);
 return m?[rom2n(m[1]),m[2].replace(/[*_#]+/g,'').trim()]:null;
}
function parseFile(name,text){

 text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');

 const hs=[...text.matchAll(re)],msgs=[];
 if(!hs.length)msgs.push({role:'assistant',ts:0,body:text});
 hs.forEach((h,i)=>{
  const end=i+1<hs.length?hs[i+1].index:text.length;
  msgs.push({role:/assistant/i.test(h[7])?'assistant':'user',
   ts:Date.UTC(+h[3],+h[2]-1,+h[1],+h[4],+h[5],+h[6]),
   body:text.slice(h.index+h[0].length,end)});
 });
 const acts=[];
 for(const m of msgs){
  if(m.role!=='assistant')continue;
  const lines=m.body.split('\n');
  let idx=[],strict=true;
  lines.forEach((l,i)=>{if(headOf(l,true))idx.push(i)});
  if(!idx.length){strict=false;lines.forEach((l,i)=>{if(headOf(l,false))idx.push(i)})}
  idx.forEach((s,k)=>{
   const h=headOf(lines[s],strict),e=k+1<idx.length?idx[k+1]:lines.length;
   const md_=cleanTail(lines.slice(s+1,e).join('\n').trim());
   if(md_)acts.push({scenario,arc,n:h[0],title:h[1],md:md_,ts:m.ts,src:name});
  });
  if(!idx.length){
   const j=lines.findIndex(l=>/^(let me|i['’]ll|i will|now,? let me)\b.*\b(writ|begin|start)/i.test(l.trim()));
   const t=j>=0?cleanTail(lines.slice(j+1).join('\n').trim()):'';
   if(t.length>500)acts.push({scenario,arc,n:acts.length+1,title:'',md:t,ts:m.ts,src:name});
  }

}

/* ---------- import ---------- */
async function importFiles(files){
 let added=0,dup=0,sheets=0,empty=[],last=null;
 for(const f of files){
  if(/\.html?$/i.test(f.name)){sheets+=importSheet(await f.text());continue}
  const acts=parseFile(f.name,await f.text());
  if(!acts.length){empty.push(f.name);continue}
  for(const a of acts){
   a.scenario=alias[a.scenario]||a.scenario;
   if(lib.some(x=>x.md===a.md)){dup++;continue}
   lib.push(a);added++;
  }
  last=alias[acts[0].scenario]||acts[0].scenario;
 }
 if(last)cur=last;
 save();render();
 if(sheets&&!added&&!empty.length)return toast(`${sheets} fiche(s) de scénario importée(s).`);
 toast(empty.length?`Format non reconnu (aucun titre d’acte trouvé) dans : ${empty.join(', ')}`:`${added} acte(s) ajouté(s)${dup?`, ${dup} déjà présent(s)`:''}.`);
}

/*ZIP*/
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=-1;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0};
function zipParts(files){
 const enc=new TextEncoder(),parts=[],cen=[];let off=0;
 const u16=v=>[v&255,v>>8&255],u32=v=>[v&255,v>>8&255,v>>16&255,v>>>24&255];
 for(const f of files){
  const nb=enc.encode(f.name),db=enc.encode(f.data),crc=crc32(db);
  const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
  parts.push(lh,nb,db);
  cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
  off+=lh.length+nb.length+db.length;
 }
 const cl=cen.reduce((t,x)=>t+x.length,0);
 parts.push(...cen,new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0]));
 return parts;
}

const plain=t=>String(t||'').replace(/\+\+(.+?)\+\+/g,'$1').replace(/<\/?[a-z]+>/gi,'');
const safeFn=t=>String(t).replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim()||'fiche';

const tg=(n,b)=>{b=String(b||'').trim();return b?`<${n}>\n${b}\n</${n}>\n\n`:''};
function charMd(c,lvl='##'){
 let o=`${lvl} ${c.name||'(sans nom)'}\n`;
 if(c.old)o+=`- Ancien prénom (abandonné, ne plus l’utiliser) : ${c.old}\n`;
 kvList(c.fields??(c.age?'âge: '+c.age:'')).forEach(([k,v])=>o+=`- ${k?up1(k):'Info'} : ${plain(v)}\n`);
 if(c.quote)o+=`- Citation : « ${plain(c.quote)} »${c.by?` (${c.by})`:''}\n`;
 const an=lines(c.anec??c.info??'');
 if(an.length)o+=`\n${lvl}# Anecdotes\n${an.map(a=>`- ${plain(a)}`).join('\n')}\n`;
 return o.trim()+'\n';
}
function secMd(p,lvl='##'){
 let o=`${lvl} ${p.name||'(sans nom)'}\n`;
 if(p.sub)o+=`- Rôle / lien : ${p.sub}\n`;
 kvList(p.fields).forEach(([k,v])=>o+=`- ${k?up1(k):'Info'} : ${plain(v)}\n`);
 const ds=lines(p.desc);
 if(ds.length)o+=`\n${lvl}# Description\n${ds.map(x=>plain(x)).join('\n\n')}\n`;
 return o.trim()+'\n';
}
function planMd(s){
 const sc=group()[s]||{};let o='';
 for(const arc of num(sc))for(const n of num(sc[arc])){
  const v=sc[arc][n],a=v[v.length-1];
  if(a.sum||a.loc)o+=`- ${arcLbl(arc)}, Acte ${n2rom(n)}${a.title?' — '+a.title:''}${a.loc?` (lieu : ${a.loc})`:''}${a.sum?' : '+plain(a.sum).replace(/\n+/g,' '):''}\n`;
 }
 return o;
}
const placesMd=I=>(I.places||[]).map(x=>`- ${x.name}${x.sub?` (dans : ${x.sub})`:''}`).join('\n');
/* contexte commun à toutes les fiches d’un scénario */
function ctxMd(s){
 const I=info[s]||{};
 return tg('synopsis',plain(I.plot))+tg('deroule_des_actes',planMd(s))+tg('lieux',placesMd(I));
}
const allChars=I=>tg('personnages_principaux',(I.chars||[]).map(c=>tg('personnage',charMd(c))).join('').trim());
const allSecs=I=>tg('personnages_secondaires',(I.sec||[]).map(p=>tg('personnage_secondaire',secMd(p))).join('').trim());
/* fiche complète du scénario */
function ficheMd(s){
 const I=info[s]||{};
 return `<scenario nom="${s.replace(/"/g,'\'')}">\n\n# ${s}\n\n${ctxMd(s)}${allChars(I)}${allSecs(I)}</scenario>\n`.replace(/\n{3,}/g,'\n\n');
}
/* fiche d’un personnage principal : contexte + lui en détail + les autres */
function charFileMd(s,c){
 const I=info[s]||{};
 const oth=(I.chars||[]).filter(x=>x!==c);
 return `<scenario nom="${s.replace(/"/g,'\'')}">\n\n# ${s}\n\n${ctxMd(s)}</scenario>\n\n`+
  tg('personnage_principal',charMd(c))+
  tg('autres_personnages_principaux',oth.map(x=>tg('personnage',charMd(x))).join('').trim())+
  allSecs(I);
}
/* fiche d’un personnage secondaire : contexte + lui en détail + les principaux */
function secFileMd(s,p){
 const I=info[s]||{};
 const oth=(I.sec||[]).filter(x=>x!==p);
 return `<scenario nom="${s.replace(/"/g,'\'')}">\n\n# ${s}\n\n${ctxMd(s)}</scenario>\n\n`+
  tg('personnage_secondaire',secMd(p))+
  allChars(I)+
  tg('autres_personnages_secondaires',oth.map(x=>tg('personnage_secondaire',secMd(x))).join('').trim());
}
function saveBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}

function exportAll(){

 if(!names.length)return toast('Aucune fiche à exporter pour l’instant.');

function thumb(file,S=192){return new Promise((res,rej)=>{
 if(file.type==='image/gif'&&file.size<600000){const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);return}
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=S;const k=Math.max(S/im.width,S/im.height),w=im.width*k,h=im.height*k;
  c.getContext('2d').drawImage(im,(S-w)/2,(S-h)*.2,w,h);URL.revokeObjectURL(u);
  let d=c.toDataURL('image/webp',.85);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.85);res(d)};
 im.onerror=()=>rej();im.src=u})}

 o.innerHTML=`<form class="glass wide"><h3>Fiche — ${esc(s)}</h3>
<div id="S_gen"><b class="eh">Général</b><label>Icône du scénario</label><div id="L_gen"></div>
<label>Couleurs du dégradé (la première est la couleur principale)</label><div class="cors">${crow('c1',P[0],'1',!colors[s])}${crow('c2',P[1],'2',!I.c2)}${crow('c3',P[2],'3',!I.c3)}</div>
<label>Synopsis (**gras**, *italique*, ++souligné++)</label><textarea name="plot" rows="6">${esc(I.plot||'')}</textarea>
<label>Galerie — un lien d’image par ligne</label><textarea name="gallery" rows="4">${esc(I.gallery||'')}</textarea></div>
${sec('chars','Personnages')}${sec('places','Lieux')}${sec('sec','Personnages secondaires')}
<div class="row"><button type="button" class="btn" data-x>Annuler</button><button class="btn pri">Enregistrer</button></div></form>`;
 document.body.appendChild(o);
 const f=o.querySelector('form'),close=()=>o.remove();
 const draw=key=>{o.querySelector('#L_'+key).innerHTML=L[key].items.map(it=>rowH(key,it)).join('')||(L[key].single?'':'<div class="n" style="margin:6px 0">Rien pour l’instant.</div>')};
 const rowsOf=key=>[...o.querySelectorAll(`.ce[data-l="${key}"]`)];

   if(fl.t==='img'){if(v)it[fl.k]=v;else if(!(it[fl.k]||'').startsWith('data:'))it[fl.k]=''}else it[fl.k]=v})});
 const imgk=key=>L[key].f.find(x=>x.t==='img').k;
 Object.keys(L).forEach(draw);

   draw(key);return}

 };
 f.addEventListener('input',e=>{if(e.target.type==='color')e.target.dataset.auto=''});
 f.addEventListener('change',async e=>{

  const nI={...I,plot:E.plot.value.trim(),gallery:E.gallery.value.trim(),icon:L.gen.items[0].icon||'',c2:auto('c2')?'':E.c2.value,c3:auto('c3')?'':E.c3.value,
   chars:clean(L.chars.items.filter(c=>c.name||c.old)),places:L.places.items.filter(p=>p.name),sec:L.sec.items.filter(p=>p.name).map(c=>({...c,fields:(c.fields||[]).filter(x=>x[1]).map(x=>`${x[0]}: ${x[1]}`).join('\n')}))};
  Object.keys(nI).forEach(k=>{if(!nI[k]||(Array.isArray(nI[k])&&!nI[k].length))delete nI[k]});

 };

function applyData(d,mode){

 if(mode==='replace'){lib=d.lib||[];colors=d.colors||{};alias=d.alias||{};order=d.order||[];info=d.info||{}}
 else{
  for(const a of d.lib||[])if(!lib.some(x=>x.md===a.md))lib.push(a);
  for(const k in d.colors||{})colors[k]??=d.colors[k];

/* ---------- import d’une ancienne page de fiches (.html) ---------- */
const rgb2hex=t=>'#'+t.split(',').map(x=>Math.max(0,Math.min(255,parseInt(x)||0)).toString(16).padStart(2,'0')).join('');
const decH=h=>{const t=document.createElement('textarea');t.innerHTML=h;return t.value};
const stripH=h=>decH(h.replace(/<[^>]+>/g,'')).replace(/\s+/g,' ').trim();
const urlOf=h=>{const m=h.match(/url\(\s*["']?([^"')]+)["']?\s*\)/);return m?m[1].trim():''};
const PLACEHOLDER=u=>!u||/placehold\.co/i.test(u);
function importSheet(txt,over){
 txt=txt.replace(/\r/g,'');
 const pals={};
 for(const m of txt.matchAll(/#(\w+)\s*\{\s*--clr1:\s*([\d,\s]+?),\s*;\s*--clr2:\s*([\d,\s]+?),\s*;\s*--clr3:\s*([\d,\s]+?),\s*;/g))pals[m[1]]=[m[2],m[3],m[4]].map(rgb2hex);
 const panels=txt.split('<div class="panel">').slice(1);
 let n=0;
 for(const pn of panels){
  const tm=pn.match(/<tit>(.*?)<\/tit>/s);if(!tm)continue;
  const title=stripH(tm[1]);if(!title)continue;
  const id=(pn.match(/<div class="container" id="(\w+)"/)||[])[1];
  const icon=(pn.match(/<top>\s*<div>\s*<img src="([^"]+)"/)||[])[1]||'';
  const sm=pn.match(/<ahha>\s*<block>(.*?)<\/block>/s);
  const plot=sm?decH(sm[1].replace(/<b>(.*?)<\/b>/gs,'**$1**').replace(/<i>(.*?)<\/i>/gs,'*$1*').replace(/<u>(.*?)<\/u>/gs,'++$1++').replace(/<[^>]+>/g,'')).replace(/\s+/g,' ').trim():'';
  let gal=[],chars=[],places=[],sec=[],last=null;
  const tok=/<div class="star-speech">(.*?)<\/div><\/div>|<gall[^>]*>(.*?)<\/gall>|<mem>(.*?)<\/mem>/gs;
  for(const t of pn.matchAll(tok)){
   if(t[1]!==undefined){
    const b=t[1],h=(b.match(/<h>(.*?)<\/h>/s)||[,''])[1],sk=h.match(/<strike>(.*?)<\/strike>/s);
    const c={old:sk?stripH(sk[1]):'',name:stripH(h.replace(/<strike>.*?<\/strike>/s,''))};
    c.media=(b.match(/<video[^>]*data-src="([^"]+)"/)||b.match(/<video[^>]*\ssrc="([^"]+)"/)||b.match(/<img[^>]*src="([^"]+)"/)||[])[1]||urlOf((b.match(/<ic\s[^>]*style="[^"]*"/)||[''])[0]);
    const q1=b.match(/<q>(.*?)<\/q>/s);if(q1)c.quote=stripH(q1[1]);
    const by=b.match(/<q-source>\s*<b>(.*?)<\/b>/s);if(by)c.by=stripH(by[1]);
    chars.push(c);last=c;
   }else if(t[2]!==undefined){
    const g=t[2];
    if(g.includes('<rapapa>')){
     for(const p of g.matchAll(/<span2>(.*?)<\/span2>/gs)){
      const nm=(p[1].match(/<w>(.*?)<\/w>/s)||[,''])[1],sb=(p[1].match(/<i>(.*?)<\/i>/s)||[,''])[1];
      if(stripH(nm))places.push({name:stripH(nm),sub:stripH(sb),img:urlOf(p[1])});
     }
    }else{
     const imgs=[...new Set([...g.matchAll(/<img src="([^"]+)"/g)].map(x=>x[1]))];
     if(g.includes('<inf>')&&last){
      last.imgs=imgs.join('\n');
      last.fields=[...g.matchAll(/<k>\s*<x>(.*?)<\/x>\s*<y>(.*?)<\/y>\s*<\/k>/gs)].map(k=>{const v=stripH(k[2]);return stripH(k[1])+': '+(/^r[ée]ponse$/i.test(v)?'':v)}).join('\n');
      const an=g.match(/<block>\s*<span>(.*?)<\/span>\s*<\/block>/s);
      if(an)last.anec=stripH(an[1]).split('✧').map(x=>x.trim()).filter(x=>x&&!/^anecdote\.?$/i.test(x)).join('\n');
     }else if(!gal.length)gal=imgs;
    }
   }else if(t[3]!==undefined){
    for(const a of t[3].matchAll(/<a>\s*<span>(.*?)<\/span>\s*<\/a>/gs)){
     const u=urlOf(a[1]),nm=stripH((a[1].match(/<b>(.*?)<\/b>/s)||[,''])[1]),sb=stripH((a[1].match(/<i>(.*?)<\/i>/s)||[,''])[1]);
     const nm2=/^idk$/i.test(nm)?'':nm,sb2=/^yet$/i.test(sb)?'':sb;
     if(!PLACEHOLDER(u)||nm2)sec.push({name:nm2,sub:sb2,img:PLACEHOLDER(u)?'':u});
    }
   }
  }
  const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
  const key=Object.keys(group()).find(k=>norm(k)===norm(title))||cap(title);
  const I=info[key]??={};
  const setIf=(k,v)=>{if(v&&!(Array.isArray(v)?!v.length:false)&&(over||!(Array.isArray(I[k])?I[k].length:I[k])))I[k]=v};
  setIf('plot',plot);setIf('icon',icon);setIf('gallery',gal.join('\n'));setIf('chars',chars);setIf('places',places);setIf('sec',sec);
  if(pals[id]){if(over||!colors[key])colors[key]=pals[id][0];setIf('c2',pals[id][1]);setIf('c3',pals[id][2])}
  if(!order.includes(key))order.push(key);
  n++;
 }
 return n;
}

function dataModal(){
 const o=document.createElement('div');o.id='modal';
 o.innerHTML=`<form class="glass"><h3>Sauvegarde des données</h3><p class="n" style="font-size:13px;line-height:1.5;margin:0 0 12px">Scénarios, titres, couleurs, ordre, synopsis et personnages tiennent dans un seul fichier, <b>lecteur-data.json</b>. Place-le dans le même dossier GitHub (Pages) que cette page : elle le charge toute seule au démarrage, sur tous tes appareils. Après une modification, exporte et remplace le fichier sur GitHub.</p><div class="dcol" style="margin-bottom:14px"><b style="font-size:14px">Synchronisation automatique avec GitHub</b><p class="n" style="font-size:12.5px;line-height:1.5;margin:0">Chaque modification est envoyée toute seule dans le fichier du dépôt (et relue à l’ouverture). Crée un jeton « fine-grained » limité à ce dépôt, avec la permission <b>Contents : Read and write</b> (github.com/settings/personal-access-tokens). Le jeton reste dans ce navigateur, à renseigner une fois par appareil, et n’est jamais écrit dans le fichier de données.</p><div class="two"><input type="text" name="gho" placeholder="Propriétaire (ton pseudo)" value="${q(gh.owner)}"><input type="text" name="ghr" placeholder="Dépôt" value="${q(gh.repo)}"></div><div class="two"><input type="text" name="ghb" placeholder="Branche (main)" value="${q(gh.branch)}"><input type="text" name="ghp" placeholder="Fichier (lecteur-data.json)" value="${q(gh.path)}"></div><input type="text" name="ght" placeholder="${gh.token?'Jeton enregistré (laisser vide pour le garder)':'Jeton d’accès GitHub'}" autocomplete="off" style="-webkit-text-security:disc"><div class="two"><button type="button" class="btn pri" data-ghs>Enregistrer et synchroniser</button><button type="button" class="btn" data-ghx>Déconnecter</button></div><button type="button" class="btn" data-ghl>Copier le lien d’installation rapide (autre appareil)</button><input type="text" id="ghl" readonly style="display:none"><p class="n" style="font-size:12px;line-height:1.5;margin:0">⚠ Ce lien contient ton jeton : envoie-le uniquement à toi-même (note personnelle, gestionnaire de mots de passe), ne le partage pas. En cas de fuite, révoque le jeton sur GitHub.</p><div class="n" id="ghst"></div></div><div class="dcol"><button type="button" class="btn" data-dl>Télécharger lecteur-data.json</button><button type="button" class="btn" data-cp>Copier le JSON</button><button type="button" class="btn" data-zipf title="Un dossier par scénario : fiche complète, un fichier par personnage principal et secondaire">Télécharger toutes les fiches pour une IA (.zip)</button><label>Importer un fichier de données</label><select name="mode"><option value="merge">Fusionner avec ma bibliothèque</option><option value="replace">Remplacer ma bibliothèque</option></select><input type="file" accept=".json,application/json" data-imp><label>Importer une ancienne page de fiches (.html)</label><select name="smode"><option value="fill">Compléter seulement les champs vides</option><option value="over">Écraser les champs importés</option></select><input type="file" accept=".html,text/html" data-sheet></div><div class="row"><button type="button" class="btn" data-x>Fermer</button></div></form>`;
 document.body.appendChild(o);
 const close=()=>o.remove();
 o.onclick=e=>{
  if(e.target===o||e.target.dataset.x!==undefined)return close();
  if(e.target.dataset.dl!==undefined)exportData();
  if(e.target.dataset.zipf!==undefined)exportAll();
  if(e.target.dataset.ghs!==undefined){
   const v=n=>o.querySelector(`[name=${n}]`).value.trim();
   gh.owner=v('gho');gh.repo=v('ghr').replace(/\.git$/,'');gh.branch=v('ghb')||'main';gh.path=v('ghp')||'lecteur-data.json';if(v('ght'))gh.token=v('ght');
   ghSave();if(!ghOn())return toast('Renseigne le propriétaire, le dépôt et le jeton.');
   ghStart();
  }
  if(e.target.dataset.ghl!==undefined){
   if(!ghOn())return toast('Enregistre d’abord la synchronisation.');
   const link=location.href.split('#')[0]+'#setup='+b64(JSON.stringify({o:gh.owner,r:gh.repo,b:gh.branch,p:gh.path,t:gh.token})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
   const i=o.querySelector('#ghl');i.style.display='';i.value=link;i.select();
   navigator.clipboard.writeText(link).then(()=>toast('Lien copié.'),()=>toast('Sélectionne et copie le lien affiché.'));
  }
  if(e.target.dataset.ghx!==undefined){gh.token='';ghSave();clearTimeout(ghT);ghT=null;setMsg('','Synchronisation désactivée.')}
  if(e.target.dataset.cp!==undefined)navigator.clipboard.writeText(payload()).then(()=>toast('JSON copié.'),()=>toast('Copie impossible.'));
 };
 o.addEventListener('change',async e=>{
  if(e.target.matches('[data-sheet]')&&e.target.files[0]){try{const n=importSheet(await e.target.files[0].text(),o.querySelector('[name=smode]').value==='over');save();render();close();toast(n?`${n} fiche(s) de scénario importée(s).`:'Aucune fiche reconnue dans ce fichier.')}catch(x){toast('Fichier illisible.')}return}
  if(!e.target.matches('[data-imp]')||!e.target.files[0])return;
  try{const d=JSON.parse(await e.target.files[0].text());if(!d||!Array.isArray(d.lib))throw 0;
   applyData(d,o.querySelector('[name=mode]').value);close();toast('Données importées.');
  }catch(x){toast('Fichier de données invalide.')}
 });
}
async function loadRemote(){
 try{
  const r=await fetch('lecteur-data.json',{cache:'no-store'});if(!r.ok)return;
  const d=await r.json();if(!d||!Array.isArray(d.lib))return;
  const at=d.savedAt||0;
  if(!lib.length||at>savedAt){applyData(d,'replace');savedAt=at||Date.now();lastSnap=snap();save();isMobile()||toast('Données chargées depuis lecteur-data.json.')}
  else if(savedAt>at&&!isMobile())toast('Tes données locales sont plus récentes que lecteur-data.json : pense à exporter.');
 }catch(e){}
}
/* ---------- synchro GitHub automatique ---------- */
const GK='lecteur-gh-v1';
let gh={owner:'',repo:'',branch:'main',path:'lecteur-data.json',token:''},ghSha=null,ghT=null,ghBusy=false,suppress=false;
try{Object.assign(gh,JSON.parse(localStorage.getItem(GK)||'{}'))}catch(e){}
const ghSave=()=>{try{localStorage.setItem(GK,JSON.stringify(gh))}catch(e){}};
const ghOn=()=>!!(gh.token&&gh.owner&&gh.repo);
const ghUrl=()=>`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
const ghH=raw=>({Authorization:'Bearer '+gh.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const hhmm=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function setMsg(short,full){const e=$('#sync');if(e){e.textContent=ghOn()?short:'';e.title=full||short}const m=$('#ghst');if(m)m.textContent=full||short}
function b64(str){const b=new TextEncoder().encode(str);let t='';for(let i=0;i<b.length;i+=0x8000)t+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(t)}
const ghErr=r=>r.status===401||r.status===403?'jeton refusé ou permissions insuffisantes ('+r.status+')':r.status===404?'dépôt, branche ou accès introuvable':'erreur '+r.status;
async function ghPull(){
 const u=ghUrl()+'?ref='+encodeURIComponent(gh.branch);
 const r=await fetch(u,{headers:ghH(),cache:'no-store'});
 if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}`,{headers:ghH()});if(!rr.ok)throw new Error(ghErr(rr));ghSha=null;return null}
 if(!r.ok)throw new Error(ghErr(r));
 const j=await r.json();ghSha=j.sha;
 let txt;
 if(j.content)txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
 else{const r2=await fetch(u,{headers:ghH(true),cache:'no-store'});if(!r2.ok)throw new Error(ghErr(r2));txt=await r2.text()}
 return JSON.parse(txt);
}
async function ghPush(retry){
 if(!ghOn())return;
 ghBusy=true;setMsg('Envoi…','Envoi vers GitHub…');
 try{
  const body={message:'Mise à jour des données — '+new Date().toLocaleString('fr-FR'),content:b64(payload()),branch:gh.branch};
  if(ghSha)body.sha=ghSha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retry){await ghPull();ghBusy=false;return ghPush(true)}
  if(!r.ok)throw new Error(ghErr(r));
  ghSha=(await r.json()).content.sha;
  setMsg('Synchronisé ✓','Synchronisé avec GitHub à '+hhmm()+'.');
 }catch(e){setMsg('Échec ✗','Échec de la synchronisation : '+e.message)}
 finally{ghBusy=false}
}
function ghSchedule(){
 if(!ghOn()||suppress||isMobile())return;
 clearTimeout(ghT);setMsg('En attente…','Modifications en attente d’envoi…');
 ghT=setTimeout(()=>{ghT=null;ghPush()},2500);
}
async function ghStart(){
 if(!ghOn())return;
 try{
  setMsg('Connexion…','Connexion à GitHub…');
  const d=await ghPull();
  if(d&&Array.isArray(d.lib)){
   const at=d.savedAt||0;
   if(!lib.length||at>savedAt){suppress=true;applyData(d,'replace');savedAt=at||Date.now();lastSnap=snap();save();suppress=false;setMsg('Synchronisé ✓','Données chargées depuis GitHub à '+hhmm()+'.');toast('Données chargées depuis GitHub.')}
   else if(savedAt>at)await ghPush();
   else setMsg('Synchronisé ✓','À jour avec GitHub ('+hhmm()+').');
  }else if(lib.length)await ghPush();
  else setMsg('Connecté ✓','Connecté à GitHub : aucun fichier de données pour l’instant.');
 }catch(e){suppress=false;setMsg('Échec ✗','Échec de la connexion : '+e.message)}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden||ghBusy||ghT)return;ghOn()&&!isMobile()?ghStart():loadRemote()});
$('#dlz').onclick=exportAll;
$('#dat').onclick=()=>{document.body.classList.remove('setm');dataModal()};
const isMobile=()=>matchMedia('(max-width:760px)').matches;
let pt;
function saveProg(){
 const m=$('#main');if(!cur)return;
 const arts=[...m.querySelectorAll('article')];if(!arts.length)return;
 const mt=m.getBoundingClientRect().top;let a=arts[0];
 for(const x of arts){if(x.getBoundingClientRect().top-mt<=40)a=x;else break}
 const f=Math.min(1,Math.max(0,(mt-a.getBoundingClientRect().top)/a.offsetHeight));
 prog[cur]={id:a.id,f};savePrefs();
}
function restoreProg(){
 const m=$('#main'),p=prog[cur];if(!p)return;
 const a=document.getElementById(p.id);if(!a)return;
 const d=a.getBoundingClientRect().top-m.getBoundingClientRect().top+p.f*a.offsetHeight;
 m.style.scrollBehavior='auto';m.scrollTop+=d;m.style.scrollBehavior='';
}
$('#main').addEventListener('scroll',()=>{clearTimeout(pt);pt=setTimeout(saveProg,300)},{passive:true});
function readSetup(){
 const m=location.hash.match(/^#setup=([\w-]+)/);if(!m)return;
 try{
  const d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
  history.replaceState(null,'',location.pathname+location.search);
  if(!d.o||!d.r||!d.t)return;
  Object.assign(gh,{owner:d.o,repo:d.r,branch:d.b||'main',path:d.p||'lecteur-data.json',token:d.t});ghSave();toast('Synchronisation GitHub configurée.');
 }catch(e){}
}
async function boot(){
 load();
 try{const d=await IDB.get('data');
  if(d&&Array.isArray(d.lib)&&(d.savedAt||0)>=savedAt){lib=d.lib;colors=d.colors||{};alias=d.alias||{};order=d.order||[];info=d.info||{};savedAt=d.savedAt||0}
 }catch(e){}
 const cleaned=cleanLib();
 lastSnap=snap();
 if(cleaned){lastSnap='';save()}
 render();restoreProg();readSetup();
 ghOn()&&!isMobile()?ghStart():loadRemote();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 setTimeout(()=>{wantCur=null},8000);
 if(lib.length)idbWrite();
}
boot();
</script>
