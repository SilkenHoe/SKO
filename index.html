<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lecteur de scénarios</title>
<style>
:root{--ink:#1c1c26;--mut:#686878;--acc:#6d5bd0;--fs:19px;--g:rgba(255,255,255,.40);--g2:rgba(255,255,255,.66);--hi:rgba(255,255,255,.78);--lo:rgba(255,255,255,.10);--sh:0 10px 34px rgba(40,40,90,.15);--b1:#dde5f8;--b2:#f5e5ee;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#eeeef6;--mut:#a2a2b6;--g:rgba(38,38,56,.42);--g2:rgba(44,44,64,.62);--hi:rgba(255,255,255,.17);--lo:rgba(255,255,255,.04);--sh:0 10px 34px rgba(0,0,0,.45);--b1:#10101a;--b2:#1b1322;color-scheme:dark}}
:root[data-theme="dark"]{--ink:#eeeef6;--mut:#a2a2b6;--g:rgba(38,38,56,.42);--g2:rgba(44,44,64,.62);--hi:rgba(255,255,255,.17);--lo:rgba(255,255,255,.04);--sh:0 10px 34px rgba(0,0,0,.45);--b1:#10101a;--b2:#1b1322;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;overflow:hidden;background:linear-gradient(135deg,var(--b1),var(--b2)) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;transition:background .5s;
background:radial-gradient(70vmax 50vmax at 6% -5%,color-mix(in srgb,var(--acc) 15%,transparent),transparent 70%)}
.glass,.btn,nav,header,article,.arcsep .btn{-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%)}
.glass,nav,header,article{background:var(--g);border:1px solid var(--hi);box-shadow:var(--sh),inset 0 1px 0 var(--hi),inset 0 -1px 0 var(--lo)}
.btn{font:inherit;color:inherit;background:var(--g);border:1px solid var(--hi);box-shadow:inset 0 1px 0 var(--hi),0 2px 8px rgba(0,0,0,.06);border-radius:999px;padding:7px 14px;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{background:var(--g2)}.btn:active{transform:scale(.96)}
.btn.sm{padding:3px 10px;font-size:12.5px}
.btn.pri{background:var(--acc);color:var(--accfg,#fff);border-color:transparent}
#app{height:100%;display:flex;flex-direction:column;gap:10px;padding:10px}
header{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 18px;border-radius:999px}
header h1{font:600 16px/1 -apple-system,"SF Pro Display",system-ui,sans-serif;margin:0 auto 0 0;letter-spacing:-.01em}
#menuBtn{display:none}
.wrap{flex:1;display:flex;gap:10px;min-height:0}
nav{width:292px;flex:none;overflow:auto;border-radius:28px;padding:10px}
.sc{margin-bottom:4px}
.sc>.t{width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;font-weight:600;padding:10px 12px;display:flex;align-items:center;gap:9px;border-radius:16px;cursor:pointer}
.sc>.t span:nth-of-type(1){flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc>.t:hover,.sc.on>.t{background:var(--g2)}
.dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 0 2px var(--hi)}
.sc.on>.t{background:var(--acc);color:var(--accfg,#fff)}
.sc.on>.t .n,.sc.on>.t .chev{color:inherit;opacity:.8}
.sc.dt>.t{box-shadow:0 -2px 0 var(--acc)}.sc.db>.t{box-shadow:0 2px 0 var(--acc)}
#ctx{position:fixed;z-index:55;min-width:210px;padding:6px;border-radius:18px;background:var(--g2)}
#ctx button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px 12px;border-radius:12px;cursor:pointer}
#ctx button:hover{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.fiche{border-radius:28px;padding:14px 18px 16px;margin:0 0 6px;background:var(--g2)}
.fh{display:flex;gap:6px;align-items:center}
.fiche .txt{font-size:15px;line-height:1.6;margin:10px 2px 12px}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:10px}
.char{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:20px;background:var(--g);border:1px solid var(--hi)}
.av{width:30%;height:100%;border-radius: 10px;object-fit:cover;flex:none;}
.ph0{display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--acc) 25%,transparent);font-weight:700;font-size:22px;color:var(--acc)}
.cn{font-size:15px}.cn del{color:var(--mut);margin-right:3px}
.age{margin-left:8px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,transparent); white-space: nowrap;}
.ci{font-size:13px;color:var(--mut);margin-top:3px;line-height:1.45}
#modal form.wide{max-width:620px;max-height:90vh;overflow:auto}
#modal textarea{width:100%;font:inherit;color:var(--ink);background:var(--g);border:1px solid var(--hi);border-radius:14px;padding:9px 12px;resize:vertical}
.ce{display:flex;gap:12px;padding:10px;margin-bottom:8px;border-radius:20px;background:var(--g);border:1px solid var(--hi)}
.cm{display:flex;flex-direction:column;gap:6px;align-items:center;width:84px;flex:none}
.cm .av{width:64px;height:64px}
.cf{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ra{display:flex;gap:6px;justify-content:flex-end}
.dcol{display:flex;flex-direction:column;gap:8px}
#modal .ce input[type=text],#modal .ce textarea{margin:0}
.n{color:var(--mut);font-weight:400;font-size:12px}
.chev{color:var(--mut);font-size:11px;width:14px;text-align:center;cursor:pointer}
.sub{padding:2px 0 8px 14px}
.arc{display:flex;align-items:center;gap:2px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:8px 0 2px}
.arc span:last-child{cursor:pointer;padding:2px 4px}
.sub a{display:block;padding:6px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font-size:14px;cursor:pointer}
.sub a:hover{background:var(--g2)}
.sub a.cur{background:var(--g2);color:var(--acc);font-weight:600;box-shadow:inset 0 1px 0 var(--hi)}
.del{margin:8px 0 0 4px;font-size:12px;color:var(--mut);background:none;border:0;cursor:pointer;font:inherit;font-size:12px}
main{flex:1;overflow:auto;scroll-behavior:smooth;border-radius:28px}
.page{max-width:740px;margin:0 auto;padding:18px 6px 120px}
.ph{display:flex;align-items:center;gap:12px;margin:8px 8px 2px}
.ph h1{font:700 32px/1.15 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
.meta{color:var(--mut);margin:2px 8px 18px}
.arcsep{display:flex;justify-content:center;gap:6px;margin:34px 0 6px}
.arcsep .btn{color:var(--acc);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
article{margin-top:14px;padding:22px 28px 14px;border-radius:30px;background:var(--g2)}
article h2{font:700 24px/1.2 -apple-system,"SF Pro Display",system-ui,sans-serif;letter-spacing:-.015em;margin:2px 0 4px}
article h2 small{display:block;font:600 11.5px/1 system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
.tools{display:flex;gap:6px;align-items:center;margin:8px 0 16px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.tools select{font:inherit;font-size:12.5px;background:var(--g);color:var(--ink);border:1px solid var(--hi);border-radius:999px;padding:3px 8px}
.txt{font:calc(var(--fs) - 2px)/1.7 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;letter-spacing:-.005em}
.txt p{margin:0 0 1em}
.txt hr{border:0;text-align:center;margin:1.6em 0}
.txt hr::after{content:"✦";color:var(--acc)}
.txt blockquote{margin:0 0 1em;padding-left:1em;border-left:3px solid var(--acc);color:var(--mut)}
.txt h3,.txt h4,.txt h5{margin:1.4em 0 .5em}
.empty{max-width:480px;margin:16vh auto 0;text-align:center;color:var(--mut);padding:26px;border-radius:30px}
.empty h2{font:700 22px system-ui;color:var(--ink);margin-top:0}
#drop{position:fixed;inset:0;background:color-mix(in srgb,var(--acc) 22%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;font:700 24px system-ui;color:var(--ink);z-index:30}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--g2);-webkit-backdrop-filter:blur(26px);backdrop-filter:blur(26px);border:1px solid var(--hi);box-shadow:var(--sh);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;max-width:90%}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);padding:16px}
#modal form{width:100%;max-width:400px;border-radius:30px;padding:22px;background:var(--g2)}
#modal h3{margin:0 0 14px;font:700 18px system-ui}
#modal label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
#modal input[type=text],#modal input[type=number],#modal select{width:100%;font:inherit;color:var(--ink);background:var(--g);border:1px solid var(--hi);border-radius:14px;padding:9px 12px;margin-bottom:2px}
#modal input[type=color]{width:44px;height:32px;border:0;background:none;padding:0;vertical-align:middle}
.sw{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.sw i{width:24px;height:24px;border-radius:50%;cursor:pointer;box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 0 2px var(--hi)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.navtop{display:none}
#scrim{display:none;position:fixed;inset:0;z-index:15;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
@media (max-width:760px){
 #menuBtn{display:inline-block;margin-right:auto}
 header h1,#dat,#imp,#sync{display:none}
 [data-es],[data-ea],[data-ev],[data-ei],[data-na],[data-nr],[data-da],[data-xv],[data-nsc]{display:none!important}
 .navtop{display:flex;justify-content:flex-end;padding:0 4px 6px}
 body.nav #scrim{display:block}
 nav{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));bottom:10px;z-index:20;transform:translateX(-120%);transition:transform .25s;width:84%;max-width:320px;background:var(--g2)}
 body.nav nav{transform:none}
 article{padding:18px 16px 8px;border-radius:26px}
 .ph h1{font-size:26px}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <button class="btn" id="menuBtn" aria-label="Menu">☰</button>
  <h1>Lecteur de scénarios</h1>
  <button class="btn" id="fm" title="Réduire le texte">A−</button>
  <button class="btn" id="fp" title="Agrandir le texte">A+</button>
  <button class="btn" id="th" title="Thème">◐</button>
  <span id="sync" class="n"></span>
  <button class="btn" id="dat">Données</button>
  <button class="btn pri" id="imp">Importer…</button>
  <input type="file" id="file" multiple accept=".txt,.md,text/plain" hidden>
 </header>
 <div class="wrap">
  <nav id="nav" class="glass"></nav>
  <main id="main"></main>
 </div>
</div>
<div id="scrim"></div>
<div id="drop">Dépose tes fichiers ici</div>
<div id="toast"></div>
<script>
//<pure>
const RV={I:1,V:5,X:10,L:50,C:100};
const rom2n=s=>/^\d+$/.test(s)?+s:[...s.toUpperCase()].reduce((a,c,i,r)=>a+(RV[c]<(RV[r[i+1]]||0)?-RV[c]:RV[c]),0);
const n2rom=n=>{let o='';for(const[k,v]of[['L',50],['XL',40],['X',10],['IX',9],['V',5],['IV',4],['I',1]])while(n>=v){o+=k;n-=v}return o||'—'};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inl=t=>esc(t)
 .replace(/`([^`]+)`/g,'<code>$1</code>')
 .replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>')
 .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
 .replace(/(^|[^*])\*(?![\s*])([^*]+?)(?<![\s*])\*(?!\*)/g,'$1<em>$2</em>')
 .replace(/(^|[^\w])_(?![\s_])([^_]+?)(?<![\s_])_(?![\w])/g,'$1<em>$2</em>')
 .replace(/~~(.+?)~~/g,'<del>$1</del>');
function md(src){
 return src.replace(/\r/g,'').split(/\n{2,}/).map(b=>{
  b=b.trim();if(!b)return'';
  if(/^([-*_])(\s*\1){2,}$/.test(b))return'<hr>';
  let m=b.match(/^(#{1,6})\s+(.*)$/s);
  if(m){const l=Math.min(5,m[1].length+2);return`<h${l}>${inl(m[2])}</h${l}>`}
  const ls=b.split('\n');
  if(ls.every(l=>/^>/.test(l)))return'<blockquote>'+md(ls.map(l=>l.replace(/^>\s?/,'')).join('\n'))+'</blockquote>';
  if(ls.every(l=>/^\s*[-*+]\s+/.test(l)))return'<ul>'+ls.map(l=>'<li>'+inl(l.replace(/^\s*[-*+]\s+/,''))+'</li>').join('')+'</ul>';
  if(ls.every(l=>/^\s*\d+[.)]\s+/.test(l)))return'<ol>'+ls.map(l=>'<li>'+inl(l.replace(/^\s*\d+[.)]\s+/,''))+'</li>').join('')+'</ol>';
  return'<p>'+inl(b.replace(/\n/g,'  \n')).replace(/  \n/g,'<br>')+'</p>';
 }).join('\n');
}
const cap=s=>s.replace(/\b\p{L}/gu,c=>c.toUpperCase());
function fileMeta(name){
 let s=name.replace(/\.[^.]+$/,'').replace(/^\d+_/,'').replace(/^venice-conversation-/i,'')
  .replace(/-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i,'');
 let arc=0;const m=s.match(/[_\s-]*arc[_\s]+([ivxlc]+|\d+)$/i);
 if(m){arc=rom2n(m[1]);s=s.slice(0,m.index)}
 s=s.replace(/[_\s-]+$/,'').replace(/[_]+/g,' ').trim()||'Sans titre';
 return{scenario:cap(s),arc};
}
const HW='Act|Acte|Chapter|Chapitre|Part|Partie|Scene|Scène';
const HRX=new RegExp('^(?:'+HW+')\\s+([IVXLC]+|\\d+)\\b[\\s*_:—–.)\\-]*(.*)$','i');
function headOf(l,strict){
 if(l.length>200)return null;
 if(strict&&!/^\s*(?:>\s*)?[*_#]/.test(l))return null;
 const m=l.replace(/^[\s*_#>]+/,'').match(HRX);
 return m?[rom2n(m[1]),m[2].replace(/[*_#]+/g,'').trim()]:null;
}
function parseFile(name,text){
 const{scenario,arc}=fileMeta(name);
 text=text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
 const re=/^\[(\d\d)\/(\d\d)\/(\d{4}), (\d\d):(\d\d):(\d\d)\] ([^\n]+?):[ \t]*$/gm;
 const hs=[...text.matchAll(re)],msgs=[];
 if(!hs.length)msgs.push({role:'assistant',ts:0,body:text});
 hs.forEach((h,i)=>{
  const end=i+1<hs.length?hs[i+1].index:text.length;
  msgs.push({role:/assistant/i.test(h[7])?'assistant':'user',
   ts:Date.UTC(+h[3],+h[2]-1,+h[1],+h[4],+h[5],+h[6]),
   body:text.slice(h.index+h[0].length,end)});
 });
 const acts=[];
 for(const m of msgs){
  if(m.role!=='assistant')continue;
  const lines=m.body.split('\n');
  let idx=[],strict=true;
  lines.forEach((l,i)=>{if(headOf(l,true))idx.push(i)});
  if(!idx.length){strict=false;lines.forEach((l,i)=>{if(headOf(l,false))idx.push(i)})}
  idx.forEach((s,k)=>{
   const h=headOf(lines[s],strict),e=k+1<idx.length?idx[k+1]:lines.length;
   const md_=lines.slice(s+1,e).join('\n').trim();
   if(md_)acts.push({scenario,arc,n:h[0],title:h[1],md:md_,ts:m.ts,src:name});
  });
  if(!idx.length){
   const j=lines.findIndex(l=>/^(let me|i['’]ll|i will|now,? let me)\b.*\b(writ|begin|start)/i.test(l.trim()));
   const t=j>=0?lines.slice(j+1).join('\n').trim():'';
   if(t.length>500)acts.push({scenario,arc,n:acts.length+1,title:'',md:t,ts:m.ts,src:name});
  }
 }
 return acts;
}
//</pure>
/* ---------- état ---------- */
const $=s=>document.querySelector(s);
const q=s=>esc(String(s)).replace(/"/g,'&quot;');
let lib=[],cur=null,ver={},fs=19,theme='auto',colors={},alias={},col={},delArm=null,order=[],info={},savedAt=0,lastSnap='',prog={},wantCur=null,fresh=false;
const KEY='lecteur-scenarios-v1',PK2='lecteur-prefs-v1';
function savePrefs(){try{localStorage.setItem(PK2,JSON.stringify({fs,theme,cur:wantCur||cur,col,prog}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');lib=d.lib||[];cur=d.cur||null;fs=d.fs||19;theme=d.theme||'auto';colors=d.colors||{};alias=d.alias||{};col=d.col||{};order=d.order||[];info=d.info||{};savedAt=d.savedAt||0}catch(e){}
 try{const p=JSON.parse(localStorage.getItem(PK2)||'{}');if(p.fs)fs=p.fs;if(p.theme)theme=p.theme;if(p.cur){cur=p.cur;wantCur=p.cur}if(p.col)col=p.col;if(p.prog)prog=p.prog}catch(e){}
 lastSnap=snap()}
const snap=()=>JSON.stringify({lib,colors,alias,order,info});
const IDB={
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('lecteur',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
let it;
function idbSoon(){clearTimeout(it);it=setTimeout(idbWrite,400)}
async function idbWrite(){
 const d={lib,colors,alias,order,info,savedAt};
 try{await IDB.set('data',d);try{localStorage.removeItem(KEY)}catch(e){}return true}
 catch(e){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(x){}return false}
}
function save(){savePrefs();const sn=snap();if(sn!==lastSnap){savedAt=Date.now();lastSnap=sn;ghSchedule();idbSoon()}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),3800)}
const hsl=(h,s,l)=>{s/=100;l/=100;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
const defColor=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return hsl(h,58,52)};
const colorOf=s=>colors[s]||defColor(s);
const PAL=['#6d5bd0','#d0587a','#e08a3c','#c9a227','#3fa66b','#2f9eb8','#4a7fd9','#8a8a99'];

function group(){
 const g={};for(const k in info)g[k]??={};
 for(const a of lib){const s=g[a.scenario]??={};const r=s[a.arc]??={};(r[a.n]??=[]).push(a)}
 for(const s in g)for(const r in g[s])for(const n in g[s][r])g[s][r][n].sort((x,y)=>x.ts-y.ts);
 return g;
}
const num=o=>Object.keys(o).map(Number).sort((a,b)=>a-b);
const words=s=>(s.match(/\S+/g)||[]).length;
const aid=(arc,n)=>`a-${arc}-${n}`;
const arcLbl=a=>a?'Arc '+n2rom(a):'Arc non précisé';
const kS=s=>'S:'+s,kA=(s,a)=>'A:'+s+'|'+a;

function render(){
 const R=document.documentElement;
 R.style.setProperty('--fs',fs+'px');
 theme==='auto'?R.removeAttribute('data-theme'):R.setAttribute('data-theme',theme);
 const g=group(),names=sortedNames(g);
 if(wantCur&&names.includes(wantCur)){cur=wantCur;wantCur=null;fresh=true}
 if(!names.includes(cur))cur=names[0]||null;
 R.style.setProperty('--acc',cur?colorOf(cur):'#6d5bd0');R.style.setProperty('--accfg',cur?fgFor(colorOf(cur)):'#fff');
 /* navigation */
 $('#nav').innerHTML='<div class="navtop"><button class="btn sm" data-navx>✕ Fermer</button></div>'+names.map(s=>{

 };
 o.innerHTML=`<form class="glass${fields.some(f=>f.t==='area')?' wide':''}"><h3>${esc(title)}</h3>${fields.map(fh).join('')}<div class="row"><button type="button" class="btn" data-x>Annuler</button><button class="btn pri">${esc(lab)}</button></div></form>`;
 document.body.appendChild(o);
 const f=o.querySelector('form'),close=()=>o.remove();
 f.querySelectorAll('select[name]').forEach(s=>s.onchange=()=>{f.elements[s.name+'_new'].style.display=s.value==='__new'?'':'none'});
 f.querySelectorAll('.sw i').forEach(i=>i.onclick=()=>{const c=f.querySelector('input[type=color]');c.value=i.dataset.c;c.dataset.auto=''});
 const au=f.querySelector('[data-auto]');if(au)au.onclick=()=>{f.querySelector('input[type=color]').dataset.auto='1';toast('Couleur automatique')};
 o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)close()};
 f.onsubmit=e=>{e.preventDefault();const v={};
  for(const fl of fields){
   const el=f.elements[fl.k];
   v[fl.k]=fl.t==='scen'?(el.value==='__new'?f.elements[fl.k+'_new'].value.trim():el.value):fl.t==='color'?(el.dataset.auto==='1'?'':el.value):fl.t==='number'?Math.max(0,parseInt(el.value)||0):el.value.trim();
  }
  close();ok(v);save();render();
 };
}

  if(nn!==s){
   lib.forEach(a=>{if(a.scenario===s)a.scenario=nn});
   for(const k in alias)if(alias[k]===s)alias[k]=nn;alias[s]=nn;order=order.map(x=>x===s?nn:x);if(info[s]){info[nn]??=info[s];delete info[s]}
   if(colors[s]){colors[nn]??=colors[s];delete colors[s]}

 });

function newAct(s,arc){

 const a=arc==='new'?(as.length?Math.max(...as):0)+1:arc===null?(as.length?Math.max(...as):1):arc;
 const ns=num(sc[a]||{}),n=(ns.length?Math.max(...ns):0)+1;
 modal('Nouvel acte',[{k:'s',t:'scen',l:'Scénario',v:s||'__new'},{k:'a',t:'number',l:'Arc',v:a},{k:'n',t:'number',l:'Numéro d’acte',v:n},{k:'t',t:'text',l:'Titre',v:''},{k:'md',t:'area',l:'Texte (Markdown)',v:''}],v=>{
  const sn=v.s||s;if(!sn)return toast('Indique un scénario.');if(!v.md)return toast('Le texte est vide : acte non créé.');
  lib.push({scenario:sn,arc:v.a,n:v.n||1,title:v.t,md:v.md,ts:Date.now(),src:'manuel'});cur=sn;
 },'Ajouter');
}

function delAct(k){const{n,sel}=pickAct(k);modal('Supprimer l’acte « '+(sel.title||'Act '+n2rom(n))+' » ?',[],()=>{lib=lib.filter(a=>a!==sel);delete ver[k]},'Supprimer')}

/* ---------- import ---------- */
async function importFiles(files){
 let added=0,dup=0,empty=[],last=null;
 for(const f of files){
  const acts=parseFile(f.name,await f.text());
  if(!acts.length){empty.push(f.name);continue}
  for(const a of acts){
   a.scenario=alias[a.scenario]||a.scenario;
   if(lib.some(x=>x.md===a.md)){dup++;continue}
   lib.push(a);added++;
  }
  last=alias[acts[0].scenario]||acts[0].scenario;
 }
 if(last)cur=last;
 save();render();
 toast(empty.length?`Format non reconnu (aucun titre d’acte trouvé) dans : ${empty.join(', ')}`:`${added} acte(s) ajouté(s)${dup?`, ${dup} déjà présent(s)`:''}.`);
}

function thumb(file){return new Promise((res,rej)=>{
 if(file.type==='image/gif'&&file.size<600000){const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);return}
 const u=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{const S=192,c=document.createElement('canvas');c.width=c.height=S;const k=Math.max(S/im.width,S/im.height),w=im.width*k,h=im.height*k;
  c.getContext('2d').drawImage(im,(S-w)/2,(S-h)*.2,w,h);URL.revokeObjectURL(u);
  let d=c.toDataURL('image/webp',.85);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/jpeg',.85);res(d)};
 im.onerror=()=>rej();im.src=u})}

 const row=c=>`<div class="ce"><div class="cm">${mediaHtml(c.media,c.name||c.old)}<input type="file" accept="image/*" hidden data-f><button type="button" class="btn sm" data-pick>Image…</button>${c.media?'<button type="button" class="btn sm" data-rm>Retirer</button>':''}</div><div class="cf"><input type="text" name="url" placeholder="…ou lien image / vidéo (https://…)" value="${q(c.media&&!c.media.startsWith('data:')?c.media:'')}"><div class="two"><input type="text" name="old" placeholder="Ancien prénom (barré)" value="${q(c.old||'')}"><input type="text" name="name" placeholder="Prénom Nom actuel" value="${q(c.name||'')}"></div><input type="text" name="age" placeholder="Âge (ex. 24 ans)" value="${q(c.age||'')}"><textarea name="info" rows="2" placeholder="Infos importantes">${esc(c.info||'')}</textarea><div class="ra"><button type="button" class="btn sm" data-up>↑</button><button type="button" class="btn sm" data-dn>↓</button><button type="button" class="btn sm" data-del>Supprimer</button></div></div></div>`;
 const draw=()=>{cl.innerHTML=cs.map(row).join('')||'<div class="n" style="margin-bottom:8px">Aucun personnage pour l’instant.</div>'};
 const sync=()=>[...cl.querySelectorAll('.ce')].forEach((e,i)=>{const c=cs[i],g=n=>e.querySelector(`[name=${n}]`).value.trim();
  c.old=g('old');c.name=g('name');c.age=g('age');c.info=g('info');const u=g('url');
  if(u)c.media=u;else if(!(c.media||'').startsWith('data:'))c.media=''});
 draw();
 o.onclick=e=>{if(e.target===o||e.target.dataset.x!==undefined)return close();
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.add!==undefined){sync();cs.push({id:uid(),old:'',name:'',age:'',info:'',media:''});draw();return}
  const ce=b.closest('.ce');if(!ce)return;
  if(b.dataset.pick!==undefined){ce.querySelector('[data-f]').click();return}
  sync();const i=[...cl.children].indexOf(ce);
  if(b.dataset.rm!==undefined)cs[i].media='';
  else if(b.dataset.up!==undefined&&i>0)[cs[i-1],cs[i]]=[cs[i],cs[i-1]];
  else if(b.dataset.dn!==undefined&&i<cs.length-1)[cs[i+1],cs[i]]=[cs[i],cs[i+1]];
  else if(b.dataset.del!==undefined)cs.splice(i,1);
  draw();
 };
 f.addEventListener('change',async e=>{
  if(!e.target.matches('[data-f]')||!e.target.files[0])return;
  const ce=e.target.closest('.ce');sync();const i=[...cl.children].indexOf(ce);
  try{cs[i].media=await thumb(e.target.files[0]);draw()}catch(x){toast('Image illisible. Pour une vidéo, colle un lien (.mp4 / .webm).')}
 });
 f.onsubmit=e=>{e.preventDefault();sync();
  const plot=f.elements.plot.value.trim(),chars=cs.filter(c=>c.name||c.old);
  if(plot||chars.length)info[s]={plot,chars};else delete info[s];
  close();save();render();
 };
}

/* ---------- sauvegarde des données ---------- */
const payload=()=>JSON.stringify({v:2,savedAt,lib,colors,alias,order,info},null,1);
async function exportData(){
 const data=payload(),name='lecteur-data.json';
 try{
  const dl=window.claude&&claude.use?await claude.use('downloads'):null;
  if(dl){await dl.save({filename:name,data});toast('Fichier prêt.');return}
 }catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;
 document.body.appendChild(a);a.click();a.remove();toast('Fichier téléchargé.');
}
function applyData(d,mode){
 if(mode==='replace'){lib=d.lib||[];colors=d.colors||{};alias=d.alias||{};order=d.order||[];info=d.info||{}}
 else{
  for(const a of d.lib||[])if(!lib.some(x=>x.md===a.md))lib.push(a);
  for(const k in d.colors||{})colors[k]??=d.colors[k];
  for(const k in d.alias||{})alias[k]??=d.alias[k];
  for(const k in d.info||{})info[k]??=d.info[k];
  for(const k of d.order||[])if(!order.includes(k))order.push(k);
 }
 save();render();
}
function dataModal(){
 const o=document.createElement('div');o.id='modal';
 o.innerHTML=`<form class="glass"><h3>Sauvegarde des données</h3><p class="n" style="font-size:13px;line-height:1.5;margin:0 0 12px">Scénarios, titres, couleurs, ordre, synopsis et personnages tiennent dans un seul fichier, <b>lecteur-data.json</b>. Place-le dans le même dossier GitHub (Pages) que cette page : elle le charge toute seule au démarrage, sur tous tes appareils. Après une modification, exporte et remplace le fichier sur GitHub.</p><div class="dcol" style="margin-bottom:14px"><b style="font-size:14px">Synchronisation automatique avec GitHub</b><p class="n" style="font-size:12.5px;line-height:1.5;margin:0">Chaque modification est envoyée toute seule dans le fichier du dépôt (et relue à l’ouverture). Crée un jeton « fine-grained » limité à ce dépôt, avec la permission <b>Contents : Read and write</b> (github.com/settings/personal-access-tokens). Le jeton reste dans ce navigateur, à renseigner une fois par appareil, et n’est jamais écrit dans le fichier de données.</p><div class="two"><input type="text" name="gho" placeholder="Propriétaire (ton pseudo)" value="${q(gh.owner)}"><input type="text" name="ghr" placeholder="Dépôt" value="${q(gh.repo)}"></div><div class="two"><input type="text" name="ghb" placeholder="Branche (main)" value="${q(gh.branch)}"><input type="text" name="ghp" placeholder="Fichier (lecteur-data.json)" value="${q(gh.path)}"></div><input type="text" name="ght" placeholder="${gh.token?'Jeton enregistré (laisser vide pour le garder)':'Jeton d’accès GitHub'}" autocomplete="off" style="-webkit-text-security:disc"><div class="two"><button type="button" class="btn pri" data-ghs>Enregistrer et synchroniser</button><button type="button" class="btn" data-ghx>Déconnecter</button></div><button type="button" class="btn" data-ghl>Copier le lien d’installation rapide (autre appareil)</button><input type="text" id="ghl" readonly style="display:none"><p class="n" style="font-size:12px;line-height:1.5;margin:0">⚠ Ce lien contient ton jeton : envoie-le uniquement à toi-même (note personnelle, gestionnaire de mots de passe), ne le partage pas. En cas de fuite, révoque le jeton sur GitHub.</p><div class="n" id="ghst"></div></div><div class="dcol"><button type="button" class="btn" data-dl>Télécharger lecteur-data.json</button><button type="button" class="btn" data-cp>Copier le JSON</button><label>Importer un fichier de données</label><select name="mode"><option value="merge">Fusionner avec ma bibliothèque</option><option value="replace">Remplacer ma bibliothèque</option></select><input type="file" accept=".json,application/json" data-imp></div><div class="row"><button type="button" class="btn" data-x>Fermer</button></div></form>`;
 document.body.appendChild(o);
 const close=()=>o.remove();
 o.onclick=e=>{
  if(e.target===o||e.target.dataset.x!==undefined)return close();
  if(e.target.dataset.dl!==undefined)exportData();
  if(e.target.dataset.ghs!==undefined){
   const v=n=>o.querySelector(`[name=${n}]`).value.trim();
   gh.owner=v('gho');gh.repo=v('ghr').replace(/\.git$/,'');gh.branch=v('ghb')||'main';gh.path=v('ghp')||'lecteur-data.json';if(v('ght'))gh.token=v('ght');
   ghSave();if(!ghOn())return toast('Renseigne le propriétaire, le dépôt et le jeton.');
   ghStart();
  }
  if(e.target.dataset.ghl!==undefined){
   if(!ghOn())return toast('Enregistre d’abord la synchronisation.');
   const link=location.href.split('#')[0]+'#setup='+b64(JSON.stringify({o:gh.owner,r:gh.repo,b:gh.branch,p:gh.path,t:gh.token})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
   const i=o.querySelector('#ghl');i.style.display='';i.value=link;i.select();
   navigator.clipboard.writeText(link).then(()=>toast('Lien copié.'),()=>toast('Sélectionne et copie le lien affiché.'));
  }
  if(e.target.dataset.ghx!==undefined){gh.token='';ghSave();clearTimeout(ghT);ghT=null;setMsg('','Synchronisation désactivée.')}
  if(e.target.dataset.cp!==undefined)navigator.clipboard.writeText(payload()).then(()=>toast('JSON copié.'),()=>toast('Copie impossible.'));
 };
 o.addEventListener('change',async e=>{
  if(!e.target.matches('[data-imp]')||!e.target.files[0])return;
  try{const d=JSON.parse(await e.target.files[0].text());if(!d||!Array.isArray(d.lib))throw 0;
   applyData(d,o.querySelector('[name=mode]').value);close();toast('Données importées.');
  }catch(x){toast('Fichier de données invalide.')}
 });
}
async function loadRemote(){
 try{
  const r=await fetch('lecteur-data.json',{cache:'no-store'});if(!r.ok)return;
  const d=await r.json();if(!d||!Array.isArray(d.lib))return;
  const at=d.savedAt||0;
  if(!lib.length||at>savedAt){applyData(d,'replace');savedAt=at||Date.now();lastSnap=snap();save();isMobile()||toast('Données chargées depuis lecteur-data.json.')}
  else if(savedAt>at&&!isMobile())toast('Tes données locales sont plus récentes que lecteur-data.json : pense à exporter.');
 }catch(e){}
}
/* ---------- synchro GitHub automatique ---------- */
const GK='lecteur-gh-v1';
let gh={owner:'',repo:'',branch:'main',path:'lecteur-data.json',token:''},ghSha=null,ghT=null,ghBusy=false,suppress=false;
try{Object.assign(gh,JSON.parse(localStorage.getItem(GK)||'{}'))}catch(e){}
const ghSave=()=>{try{localStorage.setItem(GK,JSON.stringify(gh))}catch(e){}};
const ghOn=()=>!!(gh.token&&gh.owner&&gh.repo);
const ghUrl=()=>`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}/contents/${gh.path.split('/').map(encodeURIComponent).join('/')}`;
const ghH=raw=>({Authorization:'Bearer '+gh.token,Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'});
const hhmm=()=>new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
function setMsg(short,full){const e=$('#sync');if(e){e.textContent=ghOn()?short:'';e.title=full||short}const m=$('#ghst');if(m)m.textContent=full||short}
function b64(str){const b=new TextEncoder().encode(str);let t='';for(let i=0;i<b.length;i+=0x8000)t+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(t)}
const ghErr=r=>r.status===401||r.status===403?'jeton refusé ou permissions insuffisantes ('+r.status+')':r.status===404?'dépôt, branche ou accès introuvable':'erreur '+r.status;
async function ghPull(){
 const u=ghUrl()+'?ref='+encodeURIComponent(gh.branch);
 const r=await fetch(u,{headers:ghH(),cache:'no-store'});
 if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(gh.owner)}/${encodeURIComponent(gh.repo)}`,{headers:ghH()});if(!rr.ok)throw new Error(ghErr(rr));ghSha=null;return null}
 if(!r.ok)throw new Error(ghErr(r));
 const j=await r.json();ghSha=j.sha;
 let txt;
 if(j.content)txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0)));
 else{const r2=await fetch(u,{headers:ghH(true),cache:'no-store'});if(!r2.ok)throw new Error(ghErr(r2));txt=await r2.text()}
 return JSON.parse(txt);
}
async function ghPush(retry){
 if(!ghOn())return;
 ghBusy=true;setMsg('Envoi…','Envoi vers GitHub…');
 try{
  const body={message:'Mise à jour des données — '+new Date().toLocaleString('fr-FR'),content:b64(payload()),branch:gh.branch};
  if(ghSha)body.sha=ghSha;
  const r=await fetch(ghUrl(),{method:'PUT',headers:{...ghH(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if((r.status===409||r.status===422)&&!retry){await ghPull();ghBusy=false;return ghPush(true)}
  if(!r.ok)throw new Error(ghErr(r));
  ghSha=(await r.json()).content.sha;
  setMsg('Synchronisé ✓','Synchronisé avec GitHub à '+hhmm()+'.');
 }catch(e){setMsg('Échec ✗','Échec de la synchronisation : '+e.message)}
 finally{ghBusy=false}
}
function ghSchedule(){
 if(!ghOn()||suppress||isMobile())return;
 clearTimeout(ghT);setMsg('En attente…','Modifications en attente d’envoi…');
 ghT=setTimeout(()=>{ghT=null;ghPush()},2500);
}
async function ghStart(){
 if(!ghOn())return;
 try{
  setMsg('Connexion…','Connexion à GitHub…');
  const d=await ghPull();
  if(d&&Array.isArray(d.lib)){
   const at=d.savedAt||0;
   if(!lib.length||at>savedAt){suppress=true;applyData(d,'replace');savedAt=at||Date.now();lastSnap=snap();save();suppress=false;setMsg('Synchronisé ✓','Données chargées depuis GitHub à '+hhmm()+'.');toast('Données chargées depuis GitHub.')}
   else if(savedAt>at)await ghPush();
   else setMsg('Synchronisé ✓','À jour avec GitHub ('+hhmm()+').');
  }else if(lib.length)await ghPush();
  else setMsg('Connecté ✓','Connecté à GitHub : aucun fichier de données pour l’instant.');
 }catch(e){suppress=false;setMsg('Échec ✗','Échec de la connexion : '+e.message)}
}
document.addEventListener('visibilitychange',()=>{if(document.hidden||ghBusy||ghT)return;ghOn()&&!isMobile()?ghStart():loadRemote()});
$('#dat').onclick=dataModal;
const isMobile=()=>matchMedia('(max-width:760px)').matches;
let pt;
function saveProg(){
 const m=$('#main');if(!cur)return;
 const arts=[...m.querySelectorAll('article')];if(!arts.length)return;
 const mt=m.getBoundingClientRect().top;let a=arts[0];
 for(const x of arts){if(x.getBoundingClientRect().top-mt<=40)a=x;else break}
 const f=Math.min(1,Math.max(0,(mt-a.getBoundingClientRect().top)/a.offsetHeight));
 prog[cur]={id:a.id,f};savePrefs();
}
function restoreProg(){
 const m=$('#main'),p=prog[cur];if(!p)return;
 const a=document.getElementById(p.id);if(!a)return;
 const d=a.getBoundingClientRect().top-m.getBoundingClientRect().top+p.f*a.offsetHeight;
 m.style.scrollBehavior='auto';m.scrollTop+=d;m.style.scrollBehavior='';
}
$('#main').addEventListener('scroll',()=>{clearTimeout(pt);pt=setTimeout(saveProg,300)},{passive:true});
function readSetup(){
 const m=location.hash.match(/^#setup=([\w-]+)/);if(!m)return;
 try{
  const d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));
  history.replaceState(null,'',location.pathname+location.search);
  if(!d.o||!d.r||!d.t)return;
  Object.assign(gh,{owner:d.o,repo:d.r,branch:d.b||'main',path:d.p||'lecteur-data.json',token:d.t});ghSave();toast('Synchronisation GitHub configurée.');
 }catch(e){}
}
async function boot(){
 load();
 try{const d=await IDB.get('data');
  if(d&&Array.isArray(d.lib)&&(d.savedAt||0)>=savedAt){lib=d.lib;colors=d.colors||{};alias=d.alias||{};order=d.order||[];info=d.info||{};savedAt=d.savedAt||0}
 }catch(e){}
 lastSnap=snap();
 render();restoreProg();readSetup();
 ghOn()&&!isMobile()?ghStart():loadRemote();
 try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
 setTimeout(()=>{wantCur=null},8000);
 if(lib.length)idbWrite();
}
boot();
</script>
